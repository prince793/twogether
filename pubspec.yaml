name: twogether
description: "A couples app for sharing moments together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  uuid: ^4.6.0
  flutter_animate: ^4.5.2
  provider: ^6.1.5+1
  go_router: 17.5.0
  lottie: ^3.7.0
  flutter_webrtc: ^1.6.3
  google_fonts: ^6.2.1
  cached_network_image: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/pets/
    - assets/icon/